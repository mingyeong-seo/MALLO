name: Backend CI

# backend/ 변경분에 대해서만 테스트를 돌린다. 프론트 변경만 있는 push/PR엔 안 걸리게 paths로 제한.
#
# push는 dev/main만 본다 (브랜치 전체를 보면, PR이 열려있는 브랜치에 push할 때
# push 이벤트 + pull_request 이벤트가 동시에 떠서 같은 커밋이 두 번 실행되는 걸 겪었음).
# 그 외 작업 브랜치는 PR을 통해서만 검증된다.
on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      # 테스트는 src/test/resources/application.yml의 H2 인메모리 DB로 돈다 — 별도 MySQL 컨테이너 불필요
      - name: 테스트 실행
        run: ./gradlew test

      - name: 테스트 리포트 업로드 (실패 시 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
