name: Backend Deploy (EC2)

# EC2/RDS 준비 + 수동 첫 배포 성공 + GitHub Secrets(EC2_HOST/EC2_USER/EC2_SSH_KEY) 등록까지 완료 (2026-08-19).
# 이제부터 dev에 머지(push)되면 자동 배포. 수동 실행(workflow_dispatch)도 계속 열어둠.
on:
  workflow_dispatch: {}
  push:
    branches: [dev]
    paths: ["backend/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트 (배포 전 최소 안전장치)
        run: ./gradlew test

      - name: bootJar 빌드
        run: ./gradlew bootJar

      - name: 빌드 산출물 경로 확인
        id: jar
        run: echo "path=$(ls build/libs/*.jar | head -1)" >> "$GITHUB_OUTPUT"

      # EC2에 새 jar를 app.jar.new로 올려두기만 하고, 실제 교체/재시작은 remote-deploy.sh가
      # 서버 안에서 수행한다 (전송 중간에 끊겨도 기존 app.jar는 안 건드려지게 하려는 목적).
      # remote-deploy.sh도 매번 같이 올려서 스크립트가 항상 저장소 최신 버전과 일치하게 유지.
      #
      # uses: 스텝(Docker 액션)은 잡의 defaults.run.working-directory(backend)를 안 타서
      # 저장소 루트 기준 경로를 써야 한다 (run: 셸 스텝과 다름 — 실제로 겪은 버그, 재발 방지용 주석).
      # source에 여러 줄(YAML 블록)로 넣으면 appleboy/scp-action이 통째로 하나의 패턴처럼 처리해서
      # 아무 파일도 못 찾고 "tar: empty archive"로 실패하는 걸 겪어서, 파일마다 스텝을 분리함.
      - name: EC2로 jar 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/${{ steps.jar.outputs.path }}"
          target: /home/${{ secrets.EC2_USER }}/mallo
          strip_components: 3
          rm: false

      - name: EC2로 배포 스크립트 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/scripts/deploy/remote-deploy.sh"
          target: /home/${{ secrets.EC2_USER }}/mallo
          strip_components: 3
          rm: false

      - name: 원격 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_SHARED_SECRET: ${{ secrets.AI_SHARED_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AI_BASE_URL,AI_SHARED_SECRET
          script: |
            set -euo pipefail
            cd /home/${{ secrets.EC2_USER }}/mallo
            JAR_NAME=$(basename "${{ steps.jar.outputs.path }}")
            mv "$JAR_NAME" app.jar.new

            # AI_BASE_URL/AI_SHARED_SECRET은 GitHub Actions Secrets가 source of truth라
            # 배포 때마다 .env에 upsert한다 (없으면 추가, 있으면 최신값으로 교체) —
            # 서버 .env를 손으로 계속 안 고쳐도 되게 하려는 목적. 2026-08-20 AI 연동 시작하며 추가.
            for VAR in AI_BASE_URL AI_SHARED_SECRET; do
              VALUE=$(eval echo \$$VAR)
              if grep -q "^${VAR}=" .env; then
                sed -i "s|^${VAR}=.*|${VAR}=${VALUE}|" .env
              else
                echo "${VAR}=${VALUE}" >> .env
              fi
            done

            bash remote-deploy.sh
