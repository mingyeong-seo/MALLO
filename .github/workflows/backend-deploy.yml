name: Backend Deploy (EC2)

# 지금은 EC2가 아직 없어서 수동 실행(workflow_dispatch)만 열어둔다.
# EC2 준비되고 아래 시크릿 다 등록하면, 이 on: 블록에
#   push:
#     branches: [main]
#     paths: ["backend/**"]
# 를 추가해서 자동 배포로 전환하면 됨 (docs/EC2_DEPLOY_SETUP.md 참고).
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-gradle@v4

      - name: 테스트 (배포 전 최소 안전장치)
        run: ./gradlew test

      - name: bootJar 빌드
        run: ./gradlew bootJar

      - name: 빌드 산출물 경로 확인
        id: jar
        run: echo "path=$(ls build/libs/*.jar | head -1)" >> "$GITHUB_OUTPUT"

      # EC2에 새 jar를 app.jar.new로 올려두기만 하고, 실제 교체/재시작은 remote-deploy.sh가
      # 서버 안에서 수행한다 (전송 중간에 끊겨도 기존 app.jar는 안 건드려지게 하려는 목적).
      # remote-deploy.sh도 매번 같이 올려서 스크립트가 항상 저장소 최신 버전과 일치하게 유지.
      - name: EC2로 jar + 배포 스크립트 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: |
            ${{ steps.jar.outputs.path }}
            scripts/deploy/remote-deploy.sh
          target: /home/${{ secrets.EC2_USER }}/mallo
          strip_components: 2
          rm: false

      - name: 원격 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/${{ secrets.EC2_USER }}/mallo
            JAR_NAME=$(basename "${{ steps.jar.outputs.path }}")
            mv "$JAR_NAME" app.jar.new
            bash remote-deploy.sh
