server:
  # nginx가 443(HTTPS)을 받아서 앱한테는 내부적으로 http://127.0.0.1:8080으로 전달하는데,
  # 이 설정이 없으면 Spring이 X-Forwarded-Proto 헤더를 무시해서 요청 scheme을 항상 http로 인식한다.
  # 그러면 springdoc이 Swagger 서버 URL을 http://...로 잘못 생성해서, HTTPS로 접속한 페이지에서
  # http로 fetch를 시도하다가 브라우저 mixed-content 차단으로 "Failed to fetch"가 남 (실제 겪은 문제).
  forward-headers-strategy: framework

spring:
  application:
    name: backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      # 사진은 한 장씩만 업로드받는다 (여러 장은 프론트가 여러 번 호출해서 photoRecordId를 모음)
      max-file-size: 10MB
      max-request-size: 10MB

cors:
  # 콤마로 구분해서 여러 개 등록 가능. 와일드카드(*) 지원 — 기본값이 로컬호스트 전체 포트를
  # 허용해서 Expo Web 개발 서버 포트가 바뀌어도(8081, 8082, ...) 따로 안 고쳐도 된다.
  # 웹/시뮬레이터 접속 주소가 localhost가 아니면 .env 에 CORS_ALLOWED_ORIGIN_PATTERNS 로 덮어쓰세요.
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

photo:
  storage:
    # 사진 원본을 로컬 디스크에 저장하는 임시(야매) 방식. 서버 배포(CI/CD) 붙으면
    # PHOTO_STORAGE_DIR을 리눅스 서버의 실제 경로로 덮어써야 한다. 지금은 프로젝트 루트 기준 상대경로.
    dir: ${PHOTO_STORAGE_DIR:./uploads/photos}
    # 위 dir을 정적 리소스로 서빙할 URL prefix (PhotoStorageConfig 참고)
    url-prefix: ${PHOTO_STORAGE_URL_PREFIX:/uploads/photos}

ai:
  base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
  shared-secret: ${AI_SHARED_SECRET:}
  connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:1000}
  read-timeout-ms: ${AI_READ_TIMEOUT_MS:8000}

fcm:
  # Firebase 콘솔 > 프로젝트 설정 > 서비스 계정 > "새 비공개 키 생성"으로 받은 JSON. 둘 중 하나만 채우면 됨.
  # - credentials-json: JSON 내용을 통째로 환경변수에 붙여넣기 (파일 필요 없음, 배포 플랫폼에 편함)
  # - credentials-path: JSON 파일을 로컬 어딘가에 두고 그 경로만 지정
  # 둘 다 안 채우면 FCM 없이 그냥 기동하고 실제 푸시는 발송되지 않는다
  # (FirebaseConfig가 경고 로그만 남기고 넘어감 — 다른 기능 개발하는 팀원이 FCM 키 없다고 앱을 못 띄우면 안 되니까).
  credentials-json: ${FCM_CREDENTIALS_JSON:}
  credentials-path: ${FCM_CREDENTIALS_PATH:}
